<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Exoplanet ML Classifier — Demo</title>
<link rel="stylesheet" href="styles.css"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="mockModel.js"></script>
<script type="text/babel" src="Header.jsx"></script>
<script type="text/babel" src="KOIForm.jsx"></script>
<script type="text/babel" src="PredictionPanel.jsx"></script>
<script type="text/babel" src="FeatureBars.jsx"></script>
<script type="text/babel" src="Leaderboard.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo } = React;

const DEFAULTS = Object.fromEntries(window.KOI_FIELDS.map(f => [f.k, f.d]));

function App() {
  const [values, setValues] = useState(DEFAULTS);
  const [result, setResult] = useState(null);
  const [threshold, setThreshold] = useState(0.5);
  const [activeModel, setActiveModel] = useState("XGBoost (tuned)");

  const onChange = (k, v) => setValues(prev => ({ ...prev, [k]: isNaN(v) ? 0 : v }));
  const onPredict = () => setResult(window.mockPredict(values));
  const onReset = () => { setValues(DEFAULTS); setResult(null); };

  return (
    <div className="app">
      <Header/>
      <div className="main">
        <div className="col">
          <KOIForm values={values} onChange={onChange} onPredict={onPredict} onReset={onReset} model={activeModel}/>
        </div>
        <div className="col">
          <PredictionPanel result={result} threshold={threshold} onThreshold={setThreshold}/>
          <FeatureBars contributions={result ? result.contributions : null}/>
        </div>
      </div>
      <div className="lb-row">
        <Leaderboard active={activeModel} onSelect={setActiveModel}/>
      </div>
      <Footer/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
