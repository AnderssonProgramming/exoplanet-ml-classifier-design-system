<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
.scale { display:flex; align-items:flex-end; gap:8px; }
.unit { display:flex; flex-direction:column; align-items:center; gap:6px; }
.box { background: var(--nasa-navy); border-radius: 4px; }
.label { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
.label b { color: var(--fg-1); font-weight: 600; }
</style></head><body>
<div class="card-stack">
  <div class="eyebrow">Spacing — 4px base · multiples of 4 only</div>
  <div class="scale">
    <div class="unit"><div class="box" style="width:4px;height:4px"></div><div class="label"><b>1</b><br/>4</div></div>
    <div class="unit"><div class="box" style="width:8px;height:8px"></div><div class="label"><b>2</b><br/>8</div></div>
    <div class="unit"><div class="box" style="width:12px;height:12px"></div><div class="label"><b>3</b><br/>12</div></div>
    <div class="unit"><div class="box" style="width:16px;height:16px"></div><div class="label"><b>4</b><br/>16</div></div>
    <div class="unit"><div class="box" style="width:24px;height:24px"></div><div class="label"><b>5</b><br/>24</div></div>
    <div class="unit"><div class="box" style="width:32px;height:32px"></div><div class="label"><b>6</b><br/>32</div></div>
    <div class="unit"><div class="box" style="width:48px;height:48px"></div><div class="label"><b>7</b><br/>48</div></div>
    <div class="unit"><div class="box" style="width:64px;height:64px"></div><div class="label"><b>8</b><br/>64</div></div>
    <div class="unit"><div class="box" style="width:96px;height:96px"></div><div class="label"><b>9</b><br/>96</div></div>
  </div>
  <div class="muted" style="font-size:12px">Slide gutters use 32 / 48 / 64 · Card padding 16 / 24 · Inline gaps 8 / 12.</div>
</div>
</body></html>
