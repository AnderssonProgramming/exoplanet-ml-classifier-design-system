<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
.badge { display:inline-flex; align-items:center; gap:6px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight:600; line-height: 1.3; font-family: var(--font-sans); border: 1px solid transparent; }
.dot { width:6px; height:6px; border-radius:50%; }
.b-pos { background:#E8F4FD; color:#0B5394; border-color:#B7DAF6 }
.b-neg { background:#FFEDE5; color:#B33A12; border-color:#FFCBB6 }
.b-good{ background:#E6F4EA; color:#1E5E2A; border-color:#BBE0C2 }
.b-warn{ background:#FFF8E1; color:#7A5300; border-color:#F0D58F }
.b-info{ background:#EDF2FB; color:#0B3D91; border-color:#C4D2EE }
.b-orange{ background:#FFF4E5; color:#B85F00; border-color:#FFD69E }
.row { display:flex; gap:8px; flex-wrap:wrap; }
</style></head><body>
<div class="card-stack">
  <div class="eyebrow">Badges · classification &amp; status</div>
  <div class="row">
    <span class="badge b-pos"><span class="dot" style="background:#2196F3"></span>CANDIDATE</span>
    <span class="badge b-neg"><span class="dot" style="background:#FF5722"></span>FALSE POSITIVE</span>
    <span class="badge b-good">F1 0.860 · best</span>
    <span class="badge b-warn">tuned</span>
    <span class="badge b-info">5-fold CV</span>
    <span class="badge b-orange">SMOTE applied</span>
  </div>
  <div class="row">
    <span class="badge" style="background:#0B3D91; color:#fff">Global Finalist</span>
    <span class="badge" style="background:#FB8C00; color:#1A1306">NASA Space Apps 2025</span>
    <span class="badge" style="background:transparent; color:var(--fg-3); border-color:var(--border)">v1.0.0</span>
    <span class="badge" style="background:transparent; color:var(--fg-3); border-color:var(--border); font-family:var(--font-mono)">RANDOM_SEED = 42</span>
  </div>
</div>
</body></html>
