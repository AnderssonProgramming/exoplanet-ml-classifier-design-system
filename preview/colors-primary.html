<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
.swatch { flex:1; min-height:96px; border-radius:8px; padding:10px 12px; display:flex; flex-direction:column; justify-content:space-between; box-shadow: var(--shadow-1); }
.swatch .name { font-weight:600; font-size:13px; }
.swatch .hex { font-family: var(--font-mono); font-size:11px; opacity:0.85; }
.swatch.dark { color:#fff; }
.swatch.light { color: var(--ink); }
</style></head><body>
<div class="card-stack">
  <div class="eyebrow">Brand · Primary</div>
  <div class="row">
    <div class="swatch dark" style="background:#051A40"><span class="name">Navy 900</span><span class="hex">#051A40</span></div>
    <div class="swatch dark" style="background:#082A66"><span class="name">Navy 800</span><span class="hex">#082A66</span></div>
    <div class="swatch dark" style="background:#0B3D91; flex:1.6; outline:2px solid var(--nasa-orange); outline-offset:-2px"><span class="name">NASA Navy ★</span><span class="hex">#0B3D91 — primary</span></div>
    <div class="swatch dark" style="background:#5778C4"><span class="name">Navy 300</span><span class="hex">#5778C4</span></div>
    <div class="swatch light" style="background:#D7E0F2"><span class="name">Navy 100</span><span class="hex">#D7E0F2</span></div>
    <div class="swatch light" style="background:#EDF2FB; box-shadow: inset 0 0 0 1px var(--border)"><span class="name">Navy 050</span><span class="hex">#EDF2FB</span></div>
  </div>
</div>
</body></html>
