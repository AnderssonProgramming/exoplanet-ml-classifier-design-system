<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
.row-spec { display:grid; grid-template-columns: 100px 1fr 180px; align-items:baseline; gap: 12px; padding: 8px 0; border-top: 1px solid var(--border); }
.row-spec:first-child { border-top: none; }
.tag { font-size:11px; font-weight:600; color: var(--nasa-navy); letter-spacing: 0.1em; text-transform:uppercase; }
.spec { font-family: var(--font-mono); font-size:11px; color: var(--fg-3); text-align:right; }
</style></head><body>
<div class="card-stack">
  <div class="eyebrow">Headings — Inter</div>
  <div>
    <div class="row-spec"><span class="tag">H1</span><span style="font-size:40px; font-weight:700; letter-spacing:-0.02em; line-height:1.1">Tabular vetting of Kepler KOIs</span><span class="spec">56px · 700 · −0.02em</span></div>
    <div class="row-spec"><span class="tag">H2</span><span style="font-size:30px; font-weight:700; letter-spacing:-0.02em">Why removing leakage matters</span><span class="spec">40px · 700</span></div>
    <div class="row-spec"><span class="tag">H3</span><span style="font-size:22px; font-weight:600">Results · test-set leaderboard</span><span class="spec">28px · 600</span></div>
    <div class="row-spec"><span class="tag">H4</span><span style="font-size:18px; font-weight:600">Decision threshold</span><span class="spec">22px · 600</span></div>
  </div>
</div>
</body></html>
