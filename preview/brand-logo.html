<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card-stack">
  <div class="eyebrow">Logo lockups</div>
  <div style="display:flex; gap:16px; align-items:stretch">
    <div style="flex:1; background: var(--bg-2); border:1px solid var(--border); border-radius:10px; padding: 16px; display:flex; align-items:center; justify-content:center;">
      <img src="../assets/eci-centauri-logo.png" alt="ECI Centauri logo" style="height: 110px; width:auto"/>
    </div>
    <div style="flex:1; background: var(--nasa-navy); border-radius:10px; padding: 16px; display:flex; align-items:center; justify-content:center;">
      <img src="../assets/eci-centauri-logo.png" alt="ECI Centauri logo on navy" style="height: 110px; width:auto; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3))"/>
    </div>
    <div style="flex:1; background: var(--bg-3); border:1px solid var(--border); border-radius:10px; padding: 16px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap: 6px;">
      <img src="../assets/eci-centauri-logo.png" alt="ECI Centauri small" style="height: 48px"/>
      <div style="font-size:10px; color:var(--fg-3); font-family:var(--font-mono)">corner watermark · 48px</div>
    </div>
  </div>
  <div class="muted" style="font-size:12px">Title slide: 110-160px tall on navy. Subsequent slides: 36-48px corner watermark.</div>
</div>
</body></html>
