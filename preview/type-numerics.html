<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card-stack">
  <div class="eyebrow">Eyebrow + numerics — defense-deck specimens</div>
  <div style="display:flex; gap:24px; align-items:flex-end">
    <div>
      <div style="font-size:11px; font-weight:600; letter-spacing:0.16em; text-transform:uppercase; color:var(--nasa-navy)">Slide 13 · results</div>
      <div style="font-size:64px; font-weight:800; letter-spacing:-0.03em; line-height:1; color:var(--fg-1); font-feature-settings:'tnum'">0.860</div>
      <div style="font-size:13px; color:var(--fg-3); margin-top:4px">F1 · XGBoost (tuned) · test split</div>
    </div>
    <div>
      <div style="font-size:11px; font-weight:600; letter-spacing:0.16em; text-transform:uppercase; color:var(--nasa-orange-700)">ROC-AUC</div>
      <div style="font-size:48px; font-weight:700; letter-spacing:-0.02em; color:var(--nasa-navy); font-feature-settings:'tnum'">0.9361</div>
    </div>
    <div>
      <div style="font-size:11px; font-weight:600; letter-spacing:0.16em; text-transform:uppercase; color:var(--nasa-orange-700)">MCC</div>
      <div style="font-size:48px; font-weight:700; letter-spacing:-0.02em; color:var(--nasa-navy); font-feature-settings:'tnum'">0.7210</div>
    </div>
  </div>
  <div class="muted mono" style="font-size:11px">font-feature-settings: 'tnum' for tabular figures · always use for metric tables</div>
</div>
</body></html>
