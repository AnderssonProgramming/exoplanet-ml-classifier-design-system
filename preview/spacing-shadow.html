<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
.s { flex:1; height:90px; background: var(--bg-2); border-radius: 8px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; }
.s .name { font-weight:600; font-size:13px; color: var(--fg-1); }
.s .px { font-family: var(--font-mono); font-size:10px; color: var(--fg-3); }
</style></head><body>
<div class="card-stack">
  <div class="eyebrow">Elevation — soft, navy-tinted shadows</div>
  <div style="display:flex; gap:14px; padding: 8px 4px">
    <div class="s" style="box-shadow: 0 1px 2px rgba(11,26,64,.05), 0 1px 1px rgba(11,26,64,.04)"><div class="name">shadow-1</div><div class="px">flush surface</div></div>
    <div class="s" style="box-shadow: 0 2px 6px rgba(11,26,64,.06), 0 1px 2px rgba(11,26,64,.04)"><div class="name">shadow-2</div><div class="px">card resting</div></div>
    <div class="s" style="box-shadow: 0 8px 24px rgba(11,26,64,.08), 0 2px 6px rgba(11,26,64,.04)"><div class="name">shadow-3</div><div class="px">popover, lift</div></div>
    <div class="s" style="box-shadow: 0 18px 48px rgba(11,26,64,.12), 0 4px 12px rgba(11,26,64,.05)"><div class="name">shadow-4</div><div class="px">modal, focus</div></div>
  </div>
</div>
</body></html>
