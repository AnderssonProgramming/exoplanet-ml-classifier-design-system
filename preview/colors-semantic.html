<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
.row-tight .chip { flex:1; border-radius:8px; padding:12px; display:flex; gap:10px; align-items:center; box-shadow: var(--shadow-1); background: var(--bg-2); border: 1px solid var(--border); }
.dot { width:14px; height:14px; border-radius:50%; flex:none; }
.label { font-weight:600; font-size:13px; color: var(--fg-1); }
.hex   { font-family: var(--font-mono); font-size:11px; color: var(--fg-3); }
</style></head><body>
<div class="card-stack">
  <div class="eyebrow">Semantic · classification + status</div>
  <div class="row-tight">
    <div class="chip"><span class="dot" style="background:#2196F3"></span>
      <div><div class="label">Candidate / Positive</div><div class="hex">#2196F3 · plot positive</div></div></div>
    <div class="chip"><span class="dot" style="background:#FF5722"></span>
      <div><div class="label">False Positive</div><div class="hex">#FF5722 · plot negative</div></div></div>
  </div>
  <div class="row-tight">
    <div class="chip"><span class="dot" style="background:#2E7D32"></span>
      <div><div class="label">Good · pass</div><div class="hex">#2E7D32</div></div></div>
    <div class="chip"><span class="dot" style="background:#F57F17"></span>
      <div><div class="label">Warn</div><div class="hex">#F57F17</div></div></div>
    <div class="chip"><span class="dot" style="background:#C62828"></span>
      <div><div class="label">Bad · fail</div><div class="hex">#C62828</div></div></div>
    <div class="chip"><span class="dot" style="background:#0B3D91"></span>
      <div><div class="label">Info</div><div class="hex">#0B3D91</div></div></div>
  </div>
</div>
</body></html>
