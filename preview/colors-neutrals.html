<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
.swatch { flex:1; min-height:84px; border-radius:8px; padding:10px 12px; display:flex; flex-direction:column; justify-content:space-between; box-shadow: var(--shadow-1); }
.swatch .name { font-weight:600; font-size:13px; }
.swatch .hex { font-family: var(--font-mono); font-size:11px; opacity:0.85; }
.swatch.dark { color:#fff; }
.swatch.light { color: var(--ink); }
</style></head><body>
<div class="card-stack">
  <div class="eyebrow">Neutrals · text + surface ramp</div>
  <div class="row">
    <div class="swatch dark" style="background:#0E1116"><span class="name">Ink — fg-1</span><span class="hex">#0E1116</span></div>
    <div class="swatch dark" style="background:#2A3142"><span class="name">Ink-2 — fg-2</span><span class="hex">#2A3142</span></div>
    <div class="swatch dark" style="background:#5A6478"><span class="name">Ink-3 — fg-3</span><span class="hex">#5A6478</span></div>
    <div class="swatch light" style="background:#8A93A6"><span class="name">Ink-4 — fg-4</span><span class="hex">#8A93A6</span></div>
  </div>
  <div class="row">
    <div class="swatch light" style="background:#C8CFD9"><span class="name">Line strong</span><span class="hex">#C8CFD9</span></div>
    <div class="swatch light" style="background:#E1E5EC"><span class="name">Line</span><span class="hex">#E1E5EC</span></div>
    <div class="swatch light" style="background:#F2F4F8; box-shadow: inset 0 0 0 1px var(--border)"><span class="name">bg-3 — sunken</span><span class="hex">#F2F4F8</span></div>
    <div class="swatch light" style="background:#FAFAFA; box-shadow: inset 0 0 0 1px var(--border)"><span class="name">bg-1 — page ★</span><span class="hex">#FAFAFA</span></div>
    <div class="swatch light" style="background:#FFFFFF; box-shadow: inset 0 0 0 1px var(--border)"><span class="name">bg-2 — paper</span><span class="hex">#FFFFFF</span></div>
  </div>
</div>
</body></html>
