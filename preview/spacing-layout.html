<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card-stack">
  <div class="eyebrow">Layout · slide grid 1920×1080</div>
  <div style="position:relative; width:640px; height:200px; background: var(--bg-2); border:1px solid var(--border); border-radius: 8px; overflow:hidden">
    <!-- safe area -->
    <div style="position:absolute; inset: 16px 24px; border: 1px dashed var(--nasa-orange); border-radius:4px"></div>
    <!-- 12 cols -->
    <div style="position:absolute; inset:16px 24px; display:grid; grid-template-columns: repeat(12, 1fr); gap: 8px">
      <div style="background:rgba(11,61,145,0.05); border-radius:2px"></div>
      <div style="background:rgba(11,61,145,0.05); border-radius:2px"></div>
      <div style="background:rgba(11,61,145,0.05); border-radius:2px"></div>
      <div style="background:rgba(11,61,145,0.05); border-radius:2px"></div>
      <div style="background:rgba(11,61,145,0.05); border-radius:2px"></div>
      <div style="background:rgba(11,61,145,0.05); border-radius:2px"></div>
      <div style="background:rgba(11,61,145,0.05); border-radius:2px"></div>
      <div style="background:rgba(11,61,145,0.05); border-radius:2px"></div>
      <div style="background:rgba(11,61,145,0.05); border-radius:2px"></div>
      <div style="background:rgba(11,61,145,0.05); border-radius:2px"></div>
      <div style="background:rgba(11,61,145,0.05); border-radius:2px"></div>
      <div style="background:rgba(11,61,145,0.05); border-radius:2px"></div>
    </div>
    <!-- title placement -->
    <div style="position:absolute; left:48px; top:34px; font-size:18px; font-weight:700; color:var(--nasa-navy)">Slide title — H1 here</div>
    <div style="position:absolute; left:48px; top:62px; width:300px; height:14px; background: var(--bg-3); border-radius:3px"></div>
    <div style="position:absolute; right:24px; bottom:14px; font-family:var(--font-mono); font-size:10px; color: var(--fg-4)">ECI · 13 / 19</div>
  </div>
  <div class="muted" style="font-size:12px">12-col grid · 64px outer margin · 24px gutter · 80px header band · 32px footer band.</div>
</div>
</body></html>
