<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
.metric { background: var(--bg-2); border:1px solid var(--border); border-radius: 12px; padding: 16px 18px; min-width: 180px; flex:1; box-shadow: var(--shadow-2); }
.metric .lbl { font-size:11px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color: var(--fg-3); }
.metric .val { font-size:36px; font-weight:800; letter-spacing:-0.02em; color: var(--fg-1); font-feature-settings:'tnum'; line-height:1.1; margin-top:4px; }
.metric .delta { font-size: 12px; color: var(--signal-good); font-weight:600; margin-top: 4px; font-family: var(--font-mono); }
.metric.featured { border-color: var(--nasa-orange); border-width:2px; padding: 15px 17px; }
.metric.featured .lbl { color: var(--nasa-orange-700); }
</style></head><body>
<div class="card-stack">
  <div class="eyebrow">Metric cards · used on results slides</div>
  <div style="display:flex; gap:12px">
    <div class="metric featured">
      <div class="lbl">F1 (test)</div><div class="val">0.860</div><div class="delta">+0.011 vs RF</div>
    </div>
    <div class="metric">
      <div class="lbl">ROC-AUC</div><div class="val">0.9361</div><div class="delta">+0.009</div>
    </div>
    <div class="metric">
      <div class="lbl">MCC</div><div class="val">0.7210</div><div class="delta">+0.022</div>
    </div>
  </div>
</div>
</body></html>
